# Pin the rule selection explicitly. Ruff's default set grows between
# releases (0.17 started reporting ~180 pyupgrade/bugbear/blind-except
# findings), which turned an unchanged tree red in CI. These are the
# correctness rules the project has always been held to; widen deliberately.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]
