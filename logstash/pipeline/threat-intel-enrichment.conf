# ===================================================================
# THREAT INTELLIGENCE ENRICHMENT PIPELINE
# ===================================================================
# This pipeline enriches security logs with threat intelligence data
# Checks IPs, domains, and file hashes against known threat feeds
# ===================================================================

filter {
  # ===================================================================
  # STAGE 1: IP Address Threat Intelligence
  # ===================================================================

  if [source][ip] or [destination][ip] or [client][ip] {

    # Check source IP against threat intel
    if [source][ip] {
      # Elasticsearch lookup for known malicious IPs
      elasticsearch {
        hosts => ["elasticsearch:9200"]
        user => "elastic"
        password => "elastic123"
        index => "threat-intel-ips-*"
        query => "threat.indicator.ip:%{[source][ip]}"
        fields => {
          "[threat][indicator][type]" => "[threat][intel][source_ip][type]"
          "[threat][indicator][confidence]" => "[threat][intel][source_ip][confidence]"
          "[threat][indicator][provider]" => "[threat][intel][source_ip][provider]"
          "[threat][indicator][description]" => "[threat][intel][source_ip][description]"
        }
        tag_on_failure => []
      }

      # If match found, mark as threat
      if [threat][intel][source_ip][type] {
        mutate {
          add_field => {
            "[threat][enriched]" => "true"
            "[threat][matched_field]" => "source.ip"
            "[threat][matched_value]" => "%{[source][ip]}"
          }
          add_tag => [ "threat_intel_match", "malicious_source_ip" ]
        }

        # Calculate threat score based on confidence
        if [threat][intel][source_ip][confidence] {
          ruby {
            code => '
              confidence = event.get("[threat][intel][source_ip][confidence]").to_i
              if confidence >= 90
                event.set("[threat][severity]", "critical")
                event.set("[threat][score]", 10)
              elsif confidence >= 70
                event.set("[threat][severity]", "high")
                event.set("[threat][score]", 8)
              elsif confidence >= 50
                event.set("[threat][severity]", "medium")
                event.set("[threat][score]", 5)
              else
                event.set("[threat][severity]", "low")
                event.set("[threat][score]", 3)
              end
            '
          }
        }
      }
    }

    # Check destination IP against threat intel
    if [destination][ip] {
      elasticsearch {
        hosts => ["elasticsearch:9200"]
        user => "elastic"
        password => "elastic123"
        index => "threat-intel-ips-*"
        query => "threat.indicator.ip:%{[destination][ip]}"
        fields => {
          "[threat][indicator][type]" => "[threat][intel][dest_ip][type]"
          "[threat][indicator][confidence]" => "[threat][intel][dest_ip][confidence]"
          "[threat][indicator][provider]" => "[threat][intel][dest_ip][provider]"
          "[threat][indicator][description]" => "[threat][intel][dest_ip][description]"
        }
        tag_on_failure => []
      }

      if [threat][intel][dest_ip][type] {
        mutate {
          add_field => {
            "[threat][enriched]" => "true"
            "[threat][matched_field]" => "destination.ip"
            "[threat][matched_value]" => "%{[destination][ip]}"
          }
          add_tag => [ "threat_intel_match", "malicious_dest_ip", "c2_communication" ]
        }
      }
    }
  }

  # ===================================================================
  # STAGE 2: Domain/URL Threat Intelligence
  # ===================================================================

  if [url][domain] or [dns][question][name] {

    # Extract domain for checking
    mutate {
      copy => {
        "[url][domain]" => "[threat][check][domain]"
        "[dns][question][name]" => "[threat][check][domain]"
      }
    }

    if [threat][check][domain] {
      # Check against malicious domains database
      elasticsearch {
        hosts => ["elasticsearch:9200"]
        user => "elastic"
        password => "elastic123"
        index => "threat-intel-domains-*"
        query => "threat.indicator.domain:%{[threat][check][domain]}"
        fields => {
          "[threat][indicator][type]" => "[threat][intel][domain][type]"
          "[threat][indicator][confidence]" => "[threat][intel][domain][confidence]"
          "[threat][indicator][category]" => "[threat][intel][domain][category]"
        }
        tag_on_failure => []
      }

      if [threat][intel][domain][type] {
        mutate {
          add_field => {
            "[threat][enriched]" => "true"
            "[threat][matched_field]" => "domain"
            "[threat][matched_value]" => "%{[threat][check][domain]}"
          }
          add_tag => [ "threat_intel_match", "malicious_domain" ]
        }

        # Specific categories
        if [threat][intel][domain][category] == "c2" {
          mutate { add_tag => [ "command_and_control" ] }
        }
        if [threat][intel][domain][category] == "phishing" {
          mutate { add_tag => [ "phishing_domain" ] }
        }
        if [threat][intel][domain][category] == "malware" {
          mutate { add_tag => [ "malware_distribution" ] }
        }
      }
    }
  }

  # ===================================================================
  # STAGE 3: File Hash Threat Intelligence
  # ===================================================================

  if [file][hash][md5] or [file][hash][sha1] or [file][hash][sha256] {

    # Check MD5 hash
    if [file][hash][md5] {
      elasticsearch {
        hosts => ["elasticsearch:9200"]
        user => "elastic"
        password => "elastic123"
        index => "threat-intel-hashes-*"
        query => "threat.indicator.hash.md5:%{[file][hash][md5]}"
        fields => {
          "[threat][indicator][malware_family]" => "[threat][intel][hash][malware_family]"
          "[threat][indicator][type]" => "[threat][intel][hash][type]"
        }
        tag_on_failure => []
      }

      if [threat][intel][hash][malware_family] {
        mutate {
          add_field => {
            "[threat][enriched]" => "true"
            "[threat][matched_field]" => "file.hash.md5"
            "[threat][matched_value]" => "%{[file][hash][md5]}"
          }
          add_tag => [ "threat_intel_match", "malicious_file_hash", "malware_detected" ]
        }
      }
    }

    # Check SHA256 hash (stronger)
    if [file][hash][sha256] {
      elasticsearch {
        hosts => ["elasticsearch:9200"]
        user => "elastic"
        password => "elastic123"
        index => "threat-intel-hashes-*"
        query => "threat.indicator.hash.sha256:%{[file][hash][sha256]}"
        fields => {
          "[threat][indicator][malware_family]" => "[threat][intel][hash][malware_family]"
          "[threat][indicator][ransomware]" => "[threat][intel][hash][ransomware]"
        }
        tag_on_failure => []
      }

      if [threat][intel][hash][malware_family] {
        mutate {
          add_tag => [ "threat_intel_match", "malicious_file_hash" ]
        }

        if [threat][intel][hash][ransomware] == "true" {
          mutate {
            add_tag => [ "ransomware_hash_match" ]
            add_field => { "[threat][severity]" => "critical" }
          }
        }
      }
    }
  }

  # ===================================================================
  # STAGE 4: Geo-IP Reputation (Built-in)
  # ===================================================================

  # Add GeoIP data for source IP
  if [source][ip] {
    geoip {
      source => "[source][ip]"
      target => "[source][geo]"
      fields => ["city_name", "country_name", "country_code2", "location"]
    }

    # Flag connections from high-risk countries
    if [source][geo][country_code2] in ["KP", "IR", "RU", "CN"] {
      mutate {
        add_tag => [ "high_risk_country" ]
        add_field => { "[threat][geo_risk]" => "high" }
      }
    }
  }

  # ===================================================================
  # STAGE 5: Known APT Group Attribution
  # ===================================================================

  # Map threat intel to known APT groups
  if "threat_intel_match" in [tags] {

    # Check for APT29 (SolarWinds) indicators
    if [threat][intel][source_ip][provider] =~ /(?i)(solarwinds|apt29|cozy bear)/ {
      mutate {
        add_field => {
          "[threat][apt_group]" => "APT29 (Cozy Bear)"
          "[threat][campaign]" => "SolarWinds Supply Chain"
        }
      }
    }

    # Check for APT28 (Fancy Bear) indicators
    if [threat][intel][source_ip][provider] =~ /(?i)(apt28|fancy bear|sofacy)/ {
      mutate {
        add_field => {
          "[threat][apt_group]" => "APT28 (Fancy Bear)"
          "[threat][campaign]" => "DNC Hack / Election Interference"
        }
      }
    }

    # Check for Lazarus Group (North Korea) indicators
    if [threat][intel][source_ip][provider] =~ /(?i)(lazarus|wannacry|bangladesh bank)/ {
      mutate {
        add_field => {
          "[threat][apt_group]" => "Lazarus Group"
          "[threat][campaign]" => "WannaCry / Financial Theft"
        }
      }
    }
  }

  # ===================================================================
  # STAGE 6: Automated Response Tagging
  # ===================================================================

  # Critical threats require immediate action
  if [threat][severity] == "critical" {
    mutate {
      add_field => {
        "[response][action]" => "block_and_alert"
        "[response][priority]" => "immediate"
      }
      add_tag => [ "requires_immediate_action" ]
    }
  }

  # High severity threats need investigation
  if [threat][severity] == "high" {
    mutate {
      add_field => {
        "[response][action]" => "alert_and_investigate"
        "[response][priority]" => "urgent"
      }
    }
  }

  # ===================================================================
  # STAGE 7: Cleanup and Indexing
  # ===================================================================

  # Remove temporary fields
  mutate {
    remove_field => [ "[threat][check]" ]
  }
}

output {
  # Send threat intel matches to dedicated index
  if "threat_intel_match" in [tags] {
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "threat-intel-matches-%{+YYYY.MM.dd}"
      document_id => "%{[@timestamp]}-%{[source][ip]}-%{[destination][ip]}"
    }

    # Also send to main security index
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "security-threats-%{+YYYY.MM.dd}"
    }

    # Debug output for threat matches
    stdout {
      codec => rubydebug {
        metadata => false
      }
    }
  }
}
