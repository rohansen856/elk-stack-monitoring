# Enhanced Logstash Pipeline for Windows and Network Device Security Logs
# This pipeline extends the base logstash.conf with advanced parsing for:
# - Windows Event Logs (via syslog)
# - Network devices (Cisco, Palo Alto, pfSense, Fortinet, Snort)

input {
  # Application logs via TCP
  tcp {
    port => 5000
    codec => json_lines
    type => "app_logs"
  }

  # Beats input for Filebeat/Metricbeat
  beats {
    port => 5044
    type => "beats"
  }

  # Syslog input for network devices AND Windows Event Logs
  udp {
    port => 514
    type => "syslog"
  }

  tcp {
    port => 514
    type => "syslog"
  }

  # GELF input for application logs
  gelf {
    port => 12201
    type => "gelf"
  }
}

filter {
  # ===================================================
  # APPLICATION LOGS PROCESSING
  # ===================================================
  if [type] == "app_logs" {
    if [logger_name] {
      mutate {
        add_field => { "service" => "todo-api" }
        add_field => { "log_category" => "application" }
      }
    }

    # Parse JSON logs
    if [message] =~ /^\{.*\}$/ {
      json {
        source => "message"
      }
    }

    # Add timestamp
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }

  # ===================================================
  # SYSLOG PROCESSING (Network Devices + Windows)
  # ===================================================
  if [type] == "syslog" {
    # Parse basic syslog structure
    grok {
      match => {
        "message" => "<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{IPORHOST:syslog_server} %{GREEDYDATA:syslog_payload}"
      }
    }

    # Parse syslog priority to get facility and severity
    ruby {
      code => "
        priority = event.get('syslog_pri').to_i
        facility = priority >> 3
        severity = priority & 7
        event.set('syslog_facility', facility)
        event.set('syslog_severity', severity)

        # Map severity to human readable
        severity_labels = ['emergency', 'alert', 'critical', 'error', 'warning', 'notice', 'info', 'debug']
        event.set('syslog_severity_label', severity_labels[severity]) if severity < 8

        # Map facility to device type
        if facility == 10
          event.set('device_type', 'windows')
        elsif facility == 23
          event.set('device_type', 'network_device')
        elsif facility == 4
          event.set('device_type', 'security')
        end
      "
    }

    # Parse timestamp
    date {
      match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss", "yyyy/MM/dd HH:mm:ss" ]
    }

    # ===================================================
    # WINDOWS EVENT LOG PARSING
    # ===================================================
    if [syslog_payload] =~ /EventID=/ {
      mutate {
        add_tag => [ "windows_event" ]
        add_field => { "log_category" => "windows_security" }
      }

      # Extract Windows Event ID and fields
      grok {
        match => {
          "syslog_payload" => [
            "Microsoft-Windows-Security-Auditing: EventID=%{NUMBER:event.id} User=%{DATA:user.name} Source=%{IP:source.ip} %{GREEDYDATA:event_message}(?: LogonType=%{NUMBER:logon.type})?(?: ProcessName=%{DATA:process.name})?(?: TargetUser=%{DATA:target.user})?"
          ]
        }
      }

      # Categorize by Event ID
      if [event][id] == "4625" {
        mutate {
          add_field => { "event.action" => "failed_logon" }
          add_field => { "event.category" => "authentication" }
          add_field => { "security_event" => "authentication_failure" }
          add_field => { "risk_score" => "6" }
        }
      }
      else if [event][id] == "4624" {
        mutate {
          add_field => { "event.action" => "successful_logon" }
          add_field => { "event.category" => "authentication" }
          add_field => { "security_event" => "authentication_success" }
          add_field => { "risk_score" => "2" }
        }
      }
      else if [event][id] == "4728" or [event][id] == "4732" or [event][id] == "4672" {
        mutate {
          add_field => { "event.action" => "privilege_escalation" }
          add_field => { "event.category" => "iam" }
          add_field => { "security_event" => "privilege_escalation" }
          add_field => { "risk_score" => "8" }
        }
      }
      else if [event][id] == "4776" {
        mutate {
          add_field => { "event.action" => "ntlm_auth" }
          add_field => { "event.category" => "authentication" }
          add_field => { "security_event" => "lateral_movement" }
          add_field => { "risk_score" => "7" }
        }
      }
      else if [event][id] == "7045" {
        mutate {
          add_field => { "event.action" => "service_installed" }
          add_field => { "event.category" => "process" }
          add_field => { "security_event" => "persistence_mechanism" }
          add_field => { "risk_score" => "9" }
        }
      }
      else if [event][id] == "4688" {
        mutate {
          add_field => { "event.action" => "process_created" }
          add_field => { "event.category" => "process" }
          add_field => { "security_event" => "process_execution" }
          add_field => { "risk_score" => "5" }
        }

        # Check for suspicious commands
        if [event_message] =~ /(?i)(powershell.*-enc|mimikatz|psexec|wmic|net user|sekurlsa)/ {
          mutate {
            update => { "risk_score" => "10" }
            add_field => { "threat_detected" => "malicious_command" }
          }
        }
      }
      else if [event][id] == "5140" {
        mutate {
          add_field => { "event.action" => "network_share_access" }
          add_field => { "event.category" => "file" }
          add_field => { "security_event" => "data_access" }
          add_field => { "risk_score" => "4" }
        }
      }
    }

    # ===================================================
    # CISCO ASA FIREWALL PARSING
    # ===================================================
    else if [syslog_payload] =~ /%ASA-/ {
      mutate {
        add_tag => [ "cisco_asa" ]
        add_field => { "log_category" => "network_firewall" }
        add_field => { "device_vendor" => "cisco" }
      }

      grok {
        match => {
          "syslog_payload" => "%ASA-%{NUMBER:severity}-%{NUMBER:message_id}: %{GREEDYDATA:fw_message}"
        }
      }

      # Parse deny messages
      if [fw_message] =~ /Deny/ {
        grok {
          match => {
            "fw_message" => "Deny %{WORD:network.transport} src %{DATA:src_zone}:%{IP:source.ip}/%{NUMBER:source.port} dst %{DATA:dst_zone}:%{IP:destination.ip}/%{NUMBER:destination.port}"
          }
        }

        mutate {
          add_field => { "event.action" => "firewall_deny" }
          add_field => { "security_event" => "blocked_traffic" }
          add_field => { "risk_score" => "3" }
        }
      }
    }

    # ===================================================
    # PALO ALTO FIREWALL PARSING
    # ===================================================
    else if [syslog_payload] =~ /TRAFFIC,threat/ {
      mutate {
        add_tag => [ "paloalto" ]
        add_field => { "log_category" => "network_firewall" }
        add_field => { "device_vendor" => "paloalto" }
      }

      # Parse Palo Alto CSV format
      csv {
        source => "syslog_payload"
        columns => ["log_type","threat_type","unused1","date_time","source.ip","source.port","destination","dest_port","action","protocol","transport","src_zone","dst_zone","rule","threat_name","severity","direction"]
      }

      mutate {
        add_field => { "event.action" => "threat_detected" }
        add_field => { "security_event" => "c2_communication" }
      }

      # Set risk score based on severity
      if [severity] == "high" or [severity] == "critical" {
        mutate { add_field => { "risk_score" => "9" } }
      } else if [severity] == "medium" {
        mutate { add_field => { "risk_score" => "6" } }
      } else {
        mutate { add_field => { "risk_score" => "4" } }
      }
    }

    # ===================================================
    # PFSENSE / SSH BRUTE FORCE PARSING
    # ===================================================
    else if [syslog_payload] =~ /sshd/ {
      mutate {
        add_tag => [ "ssh_event" ]
        add_field => { "log_category" => "authentication" }
      }

      grok {
        match => {
          "syslog_payload" => [
            "sshd\[%{NUMBER:pid}\]: Failed password for %{USERNAME:user.name} from %{IP:source.ip} port %{NUMBER:source.port}",
            "sshd\[%{NUMBER:pid}\]: Accepted password for %{USERNAME:user.name} from %{IP:source.ip} port %{NUMBER:source.port}"
          ]
        }
      }

      if "Failed" in [syslog_payload] {
        mutate {
          add_field => { "event.action" => "ssh_failed" }
          add_field => { "security_event" => "authentication_failure" }
          add_field => { "risk_score" => "5" }
        }
      } else if "Accepted" in [syslog_payload] {
        mutate {
          add_field => { "event.action" => "ssh_success" }
          add_field => { "security_event" => "authentication_success" }
          add_field => { "risk_score" => "2" }
        }
      }
    }

    # ===================================================
    # FORTINET FORTIGATE PARSING
    # ===================================================
    else if [syslog_payload] =~ /devname="FortiGate/ {
      mutate {
        add_tag => [ "fortinet" ]
        add_field => { "log_category" => "network_firewall" }
        add_field => { "device_vendor" => "fortinet" }
      }

      # Parse Fortinet key=value format
      kv {
        source => "syslog_payload"
        field_split => " "
        value_split => "="
        trim_key => "\""
        trim_value => "\""
      }

      mutate {
        rename => { "srcip" => "[source][ip]" }
        rename => { "dstip" => "[destination][ip]" }
        rename => { "srcport" => "[source][port]" }
        rename => { "dstport" => "[destination][port]" }
        rename => { "proto" => "[network][transport]" }
        rename => { "msg" => "[event][description]" }
      }

      if "DoS" in [event][description] {
        mutate {
          add_field => { "event.action" => "ddos_detected" }
          add_field => { "security_event" => "denial_of_service" }
          add_field => { "risk_score" => "9" }
        }
      }
    }

    # ===================================================
    # SNORT IDS PARSING
    # ===================================================
    else if [syslog_payload] =~ /\[Classification:/ {
      mutate {
        add_tag => [ "snort_ids" ]
        add_field => { "log_category" => "ids_ips" }
        add_field => { "device_vendor" => "snort" }
      }

      grok {
        match => {
          "syslog_payload" => "\[%{NUMBER:signature_id}:%{NUMBER:signature_rev}:%{NUMBER}\] %{DATA:alert_name} \[Classification: %{DATA:classification}\] \[Priority: %{NUMBER:priority}\] \{%{DATA:network.transport}\} %{IP:source.ip}:%{NUMBER:source.port} -> %{IP:destination.ip}:%{NUMBER:destination.port}"
        }
      }

      mutate {
        add_field => { "event.action" => "ids_alert" }
        add_field => { "security_event" => "intrusion_detected" }
      }

      # Set risk based on priority
      if [priority] == "1" {
        mutate { add_field => { "risk_score" => "10" } }
      } else if [priority] == "2" {
        mutate { add_field => { "risk_score" => "7" } }
      } else {
        mutate { add_field => { "risk_score" => "5" } }
      }

      # Detect specific threats
      if [alert_name] =~ /(?i)ransomware/ {
        mutate { add_field => { "threat_type" => "ransomware" } }
      } else if [alert_name] =~ /(?i)trojan|malware/ {
        mutate { add_field => { "threat_type" => "malware" } }
      } else if [alert_name] =~ /(?i)sql injection|xss/ {
        mutate { add_field => { "threat_type" => "web_attack" } }
      }
    }

    # ===================================================
    # CISCO ROUTER CONFIG CHANGES
    # ===================================================
    else if [syslog_payload] =~ /%SYS-|%SEC_LOGIN-/ {
      mutate {
        add_tag => [ "cisco_router" ]
        add_field => { "log_category" => "network_device" }
        add_field => { "device_vendor" => "cisco" }
      }

      if [syslog_payload] =~ /LOGIN_FAILED/ {
        grok {
          match => {
            "syslog_payload" => "Login failed for user %{USERNAME:user.name} from %{IP:source.ip}"
          }
        }
        mutate {
          add_field => { "event.action" => "login_failed" }
          add_field => { "security_event" => "authentication_failure" }
          add_field => { "risk_score" => "6" }
        }
      } else if [syslog_payload] =~ /CONFIG_I/ {
        mutate {
          add_field => { "event.action" => "config_change" }
          add_field => { "security_event" => "configuration_modified" }
          add_field => { "risk_score" => "7" }
        }
      }
    }

    # Default categorization for uncategorized syslogs
    if ![log_category] {
      mutate { add_field => { "log_category" => "system" } }
    }
  }

  # ===================================================
  # BEATS PROCESSING (Filebeat/Metricbeat)
  # ===================================================
  if [type] == "beats" {
    if [log_type] {
      mutate {
        add_field => { "log_category" => "%{log_type}" }
      }
    }

    # Extract IP addresses for GeoIP lookup
    if [message] {
      grok {
        match => { "message" => "%{IP:src_ip}" }
        tag_on_failure => ["_grokparsefailure_no_ip"]
      }
    }
  }

  # ===================================================
  # GEOIP ENRICHMENT FOR EXTERNAL IPS
  # ===================================================
  if [source][ip] and [source][ip] !~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.|::1|localhost)/ {
    geoip {
      source => "[source][ip]"
      target => "[source][geo]"
    }
  }

  if [src_ip] and [src_ip] !~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.|::1|localhost)/ {
    geoip {
      source => "src_ip"
      target => "geoip"
    }
  }

  # ===================================================
  # ADD COMMON ENRICHMENT FIELDS
  # ===================================================
  mutate {
    add_field => { "[@metadata][index_prefix]" => "logs" }
    add_field => { "event_ingested" => "%{@timestamp}" }
    add_field => { "ecs.version" => "8.0.0" }
  }

  # Clean up fields
  mutate {
    remove_field => [ "[beat]", "[prospector]", "[input]", "[offset]", "syslog_payload" ]
  }
}

output {
  # ===================================================
  # ROUTE TO APPROPRIATE ELASTICSEARCH INDICES
  # ===================================================

  # Windows Security Logs
  if "windows_event" in [tags] {
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "security-windows-logs-%{+YYYY.MM.dd}"
    }
  }

  # Network Firewall Logs (Cisco, Palo Alto, Fortinet, pfSense)
  else if [log_category] == "network_firewall" {
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "security-firewall-logs-%{+YYYY.MM.dd}"
    }
  }

  # IDS/IPS Alerts (Snort, Suricata)
  else if [log_category] == "ids_ips" {
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "security-ids-logs-%{+YYYY.MM.dd}"
    }
  }

  # Authentication Logs (SSH, etc.)
  else if [log_category] == "authentication" or [log_category] == "system_auth" {
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "security-auth-logs-%{+YYYY.MM.dd}"
    }
  }

  # Network Device Configuration Changes
  else if [log_category] == "network_device" {
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "security-network-logs-%{+YYYY.MM.dd}"
    }
  }

  # Application Logs
  else if [log_category] == "application" {
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "application-logs-%{+YYYY.MM.dd}"
    }
  }

  # Default: System Logs
  else {
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "system-logs-%{+YYYY.MM.dd}"
    }
  }

  # Debug output (disable in production)
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
