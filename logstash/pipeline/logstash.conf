input {
  # Application logs via TCP
  tcp {
    port => 5000
    codec => json_lines
    type => "app_logs"
  }

  # Beats input for Filebeat/Metricbeat
  beats {
    port => 5044
    type => "beats"
  }

  # Syslog input for network devices (firewalls, routers, switches)
  udp {
    port => 514
    type => "syslog"
  }

  tcp {
    port => 514
    type => "syslog"
  }

  # GELF input for application logs
  gelf {
    port => 12201
    type => "gelf"
  }
}

filter {
  # Application logs processing
  if [type] == "app_logs" {
    if [logger_name] {
      mutate {
        add_field => { "service" => "todo-api" }
        add_field => { "log_category" => "application" }
      }
    }

    # Parse JSON logs
    if [message] =~ /^\{.*\}$/ {
      json {
        source => "message"
      }
    }

    # Add timestamp
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }

  # Syslog processing for network devices
  if [type] == "syslog" {
    grok {
      match => {
        "message" => "<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{IPORHOST:syslog_server} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}"
      }
    }

    # Parse syslog priority
    ruby {
      code => "
        priority = event.get('syslog_pri').to_i
        facility = priority >> 3
        severity = priority & 7
        event.set('syslog_facility', facility)
        event.set('syslog_severity', severity)

        # Map severity to human readable
        severity_labels = ['emergency', 'alert', 'critical', 'error', 'warning', 'notice', 'info', 'debug']
        event.set('syslog_severity_label', severity_labels[severity]) if severity < 8
      "
    }

    # Parse timestamp
    date {
      match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
    }

    # Add log category based on program
    if [syslog_program] =~ /(?i)(ssh|sshd)/ {
      mutate { add_field => { "log_category" => "authentication" } }
    } else if [syslog_program] =~ /(?i)(sudo|su)/ {
      mutate { add_field => { "log_category" => "privilege_escalation" } }
    } else if [syslog_program] =~ /(?i)(iptables|ufw|pf)/ {
      mutate { add_field => { "log_category" => "network_security" } }
    } else if [syslog_program] =~ /(?i)(audit|auditd)/ {
      mutate { add_field => { "log_category" => "file_access" } }
    } else {
      mutate { add_field => { "log_category" => "system" } }
    }
  }

  # Beats processing (Filebeat/Metricbeat)
  if [type] == "beats" {
    if [log_type] {
      mutate {
        add_field => { "log_category" => "%{log_type}" }
      }
    }

    # Extract IP addresses for GeoIP lookup
    if [message] {
      grok {
        match => { "message" => "%{IP:src_ip}" }
        tag_on_failure => ["_grokparsefailure_no_ip"]
      }
    }
  }

  # GeoIP enrichment for external IPs
  if [src_ip] and [src_ip] !~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.|::1|localhost)/ {
    geoip {
      source => "src_ip"
      target => "geoip"
    }
  }

  # Add enrichment fields
  mutate {
    add_field => { "[@metadata][index_prefix]" => "logs" }
    add_field => { "event_ingested" => "%{@timestamp}" }
  }

  # Parse common authentication patterns
  if [log_category] == "authentication" or [log_category] == "system_auth" {
    grok {
      match => {
        "message" => [
          "Failed password for %{USERNAME:failed_user} from %{IP:src_ip} port %{INT:src_port}",
          "Accepted password for %{USERNAME:successful_user} from %{IP:src_ip} port %{INT:src_port}",
          "Invalid user %{USERNAME:invalid_user} from %{IP:src_ip}",
          "authentication failure.*user=%{USERNAME:failed_user}.*rhost=%{IP:src_ip}"
        ]
      }
      tag_on_failure => ["_grokparsefailure_auth"]
    }

    # Flag suspicious authentication events
    if [failed_user] or [invalid_user] {
      mutate {
        add_field => { "security_event" => "authentication_failure" }
        add_field => { "risk_score" => "5" }
      }
    }

    if [successful_user] {
      mutate {
        add_field => { "security_event" => "authentication_success" }
        add_field => { "risk_score" => "1" }
      }
    }
  }

  # Parse network traffic patterns
  if [log_category] == "network_security" or [log_category] == "network_firewall" {
    grok {
      match => {
        "message" => [
          "\[UFW BLOCK\] IN=%{WORD:interface_in}.*SRC=%{IP:src_ip} DST=%{IP:dst_ip}.*PROTO=%{WORD:protocol} SPT=%{INT:src_port} DPT=%{INT:dst_port}",
          "DENY.*IN=%{WORD:interface_in}.*SRC=%{IP:src_ip} DST=%{IP:dst_ip}.*PROTO=%{WORD:protocol}"
        ]
      }
      tag_on_failure => ["_grokparsefailure_network"]
    }

    mutate {
      add_field => { "security_event" => "network_block" }
      add_field => { "risk_score" => "3" }
    }
  }

  # Clean up fields
  mutate {
    remove_field => [ "[beat]", "[prospector]", "[input]", "[offset]" ]
  }
}

output {
  # Route to different indices based on log category
  if [log_category] == "authentication" or [log_category] == "system_auth" {
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "security-auth-logs-%{+YYYY.MM.dd}"
    }
  } else if [log_category] == "network_security" or [log_category] == "network_firewall" {
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "security-network-logs-%{+YYYY.MM.dd}"
    }
  } else if [log_category] == "file_access_audit" {
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "security-audit-logs-%{+YYYY.MM.dd}"
    }
  } else if [log_category] == "application" {
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "application-logs-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      user => "elastic"
      password => "elastic123"
      hosts => ["elasticsearch:9200"]
      index => "system-logs-%{+YYYY.MM.dd}"
    }
  }

  # Debug output (can be disabled in production)
  stdout {
    codec => rubydebug
  }
}