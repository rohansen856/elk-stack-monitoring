# Gitleaks configuration.
#
# The allowlist below covers environment-variable *references* only. It must
# never be widened to cover literal credentials - the audit found a JWT signing
# key and a cluster password committed to this public repository, and this scan
# is what prevents a recurrence.

[extend]
useDefault = true

[allowlist]
description = "Environment-variable references and documentation placeholders"
regexTarget = "match"
regexes = [
  # ${VAR}, $VAR and compose-escaped $$VAR are references, not secrets.
  '''\$\$?\{?[A-Za-z_][A-Za-z0-9_]*\}?''',
  # Obvious placeholders in examples and templates.
  '''(?i)(REPLACE_ME|CHANGE_ME|your[-_]?(secret|password|key)|xxxx|<REDACTED)''',
]
paths = [
  # Historical audit record: it quotes the values it found, by design.
  '''AUDIT/.*''',
  # .env.example intentionally ships real, randomly generated DEVELOPMENT
  # credentials so `cp .env.example .env && docker compose up -d` works with no
  # further steps. They are documented as dev-only and must be regenerated
  # before any real deployment. The real .env is gitignored and never committed.
  # This allowlist covers the example file ONLY - every other path is scanned.
  '''^\.env\.example$''',
]
