# Kibana configuration for production environment
server.host: "0.0.0.0"
server.shutdownTimeout: "5s"
# Credentials and hosts come from the ELASTICSEARCH_* environment variables
# set in docker-compose.yml, so nothing sensitive lives in this file.
elasticsearch.hosts: ["http://elasticsearch:9200"]
monitoring.ui.container.elasticsearch.enabled: true

# Security features
xpack.security.enabled: true

# Reverse proxy configuration
server.basePath: "/monitoring"
server.rewriteBasePath: true
server.publicBaseUrl: "http://localhost/monitoring"

# Performance tuning
server.maxPayload: 1048576
server.compression.enabled: true

# Content Security Policy
csp.strict: true
csp.warnLegacyBrowsers: false

# Logging configuration
logging.root:
  level: warn
logging.appenders.default:
  type: console
  layout:
    type: pattern