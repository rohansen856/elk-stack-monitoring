events {
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate limiting zones.
    # auth_limit and general_limit were previously declared here but applied to
    # no location at all, while the documentation claimed auth endpoints were
    # limited to 5r/s. Both are now actually used. See AUDIT SEC-011.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
    limit_req_status 429;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # ---- Shared proxy settings -------------------------------------------
    # Declared once, here, and NOT repeated in any location: nginx drops every
    # inherited proxy_set_header as soon as a location declares one of its own.
    # The locations used to set Cookie/Upgrade headers, so X-Real-IP and
    # X-Forwarded-For never reached the frontend or the backend, and every
    # request appeared to come from the nginx container (one global rate-limit
    # bucket; security events attributed to a single internal IP).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite rather than append ($proxy_add_x_forwarded_for): nginx is the
    # edge, so any X-Forwarded-For a client sends is untrusted. Appending let a
    # client choose the address the backend rate-limits and logs.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket upgrade (Next.js dev HMR, Kibana)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # ---- HTTP: redirect everything to HTTPS ------------------------------
    # The stack previously served plain HTTP only, so JWTs, passwords, reset
    # OTPs and all security telemetry crossed the network in cleartext.
    # See AUDIT SEC-010.
    server {
        listen 80;
        server_name _;

        # Keep the health endpoint reachable over HTTP for load balancers.
        location /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS -----------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Generate a development certificate with:
        #   mkdir -p nginx/certs && openssl req -x509 -nodes -newkey rsa:2048 \
        #     -keyout nginx/certs/server.key -out nginx/certs/server.crt \
        #     -days 365 -subj "/CN=localhost"
        # In production terminate TLS here with a real certificate, or in front
        # of nginx (AWS ALB + ACM, or Let's Encrypt via certbot).
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Increase buffer sizes for large requests
        client_max_body_size 100M;
        client_body_buffer_size 128k;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        # Root redirect to frontend
        location = / {
            return 301 /frontend;
        }

        # Browser auth flows go through the Next.js route handlers, not
        # /backend, so they need the strict auth zone here too.
        location ~ ^/frontend/api/auth/(login|register|forgot-password|reset-password)$ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://frontend:3000;
        }

        # FRONTEND -> /frontend. Next.js is built with basePath=/frontend and
        # emits correctly prefixed redirects itself; the old blanket
        # `proxy_redirect / /frontend/` would double-prefix them.
        location /frontend {
            limit_req zone=general_limit burst=40 nodelay;

            proxy_pass http://frontend:3000;
            proxy_cache_bypass $http_upgrade;
        }

        # AUTH endpoints get the stricter zone. These are the brute-force and
        # credential-stuffing targets; the application enforces its own limits
        # too, because the backend port can be reached directly.
        location ~ ^/backend/api/v1/users/(login|register|forgot-password|reset-password)$ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://app:8000;
        }

        # BACKEND -> /backend
        location /backend/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://app:8000/;

            # CORS is set by the application (app/middleware.py) from
            # CORS_ORIGINS. nginx previously added a wildcard
            # Access-Control-Allow-Origin here, which browsers reject for
            # credentialed requests and which duplicated the app's header.
            # See AUDIT CORS-001.
        }

        # KIBANA -> /monitoring
        # Kibana enforces its own authentication (xpack.security). Restrict by
        # source address as well for anything internet-facing:
        #   allow 203.0.113.0/24;
        #   deny all;
        location /monitoring {
            proxy_pass http://kibana:5601;
            proxy_cache_bypass $http_upgrade;

            # Kibana sends its own Content-Security-Policy (it needs blob:
            # workers and its own script hashes). Declaring add_header here
            # stops the stricter server-level CSP from also applying, which
            # browsers enforce as the intersection of both. The remaining
            # headers are repeated because add_header is not inherited either.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Health check endpoint for nginx itself
        location /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }
    }
}
