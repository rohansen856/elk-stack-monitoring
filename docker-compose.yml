services:
  # Generates a self-signed TLS certificate on first run so the stack is
  # usable immediately. Replace nginx/certs with a real certificate for any
  # deployment that matters.
  cert-init:
    image: alpine/openssl:latest
    volumes:
      - ./nginx/certs:/certs
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /certs/server.crt ] && [ -f /certs/server.key ]; then
          echo "TLS certificate already present; leaving it alone."
        else
          echo "Generating a self-signed development certificate..."
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout /certs/server.key -out /certs/server.crt \
            -days 365 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          chmod 644 /certs/server.crt /certs/server.key
          echo "Done."
        fi
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_BIND:-127.0.0.1}:80:80"
      - "${NGINX_BIND:-127.0.0.1}:443:443"
    depends_on:
      cert-init:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      app:
        condition: service_started
      kibana:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS material. Generate a development certificate first:
      #   mkdir -p nginx/certs && openssl req -x509 -nodes -newkey rsa:2048 \
      #     -keyout nginx/certs/server.key -out nginx/certs/server.crt \
      #     -days 365 -subj "/CN=localhost"
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d todo_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    # Redis previously ran with no authentication while published on 0.0.0.0.
    # See AUDIT CFG-001.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set in .env}
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enrollment.enabled=false
      - action.auto_create_index=true
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -u "elastic:$$ELASTIC_PASSWORD" -f http://localhost:9200/_cluster/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    env_file:
      - ./.env
    environment:
      # Referenced by logstash/pipeline/*.conf as ${ELASTIC_PASSWORD}.
      - "ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set in .env}"
      - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
      - "XPACK_MONITORING_ENABLED=true"
      - "XPACK_MONITORING_ELASTICSEARCH_HOSTS=http://elasticsearch:9200"
      - "XPACK_MONITORING_ELASTICSEARCH_USERNAME=elastic"
      - "XPACK_MONITORING_ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}"
      - "LOG_LEVEL=info"
    ports:
      - "127.0.0.1:5044:5044" # Beats input
      - "127.0.0.1:5000:5000" # TCP app logs
      - "127.0.0.1:9600:9600" # Logstash API
      - "127.0.0.1:514:514/udp" # Syslog UDP
      - "127.0.0.1:514:514/tcp" # Syslog TCP
      - "127.0.0.1:12201:12201" # GELF
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  setup-elk:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    env_file:
      - ./.env
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set in .env}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?KIBANA_SYSTEM_PASSWORD must be set in .env}
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo '=== ELK Stack Setup ==='

        until curl -s -u "elastic:$${ELASTIC_PASSWORD}" "http://elasticsearch:9200/_cluster/health" > /dev/null; do
          echo 'Waiting for Elasticsearch...'
          sleep 5
        done

        echo '✓ Elasticsearch ready'

        # 1. Set kibana_system password
        echo 'Setting kibana_system password...'
        response=$$(curl -s -w '\n%{http_code}' -X POST \
          -u "elastic:$${ELASTIC_PASSWORD}" \
          "http://elasticsearch:9200/_security/user/kibana_system/_password" \
          -H "Content-Type: application/json" \
          -d "{\"password\":\"$${KIBANA_SYSTEM_PASSWORD}\"}")

        http_code=$$(echo "$$response" | tail -n 1)

        if [ "$$http_code" -eq 200 ]; then
          echo '✓ kibana_system password set'
          # kibana.yml reads ${KIBANA_SYSTEM_PASSWORD} from the environment, so
          # there is nothing to rewrite. Editing it here previously mutated a
          # tracked file in the working tree through the bind mount.
        else
          echo "WARNING: Failed to set password (HTTP $$http_code)"
        fi

        # 2. Create Filebeat index template
        echo 'Setting up Filebeat index template...'
        curl -s -X PUT "http://elasticsearch:9200/_index_template/filebeat" \
          -u "elastic:$${ELASTIC_PASSWORD}" \
          -H "Content-Type: application/json" \
          -d '{
            "index_patterns": ["filebeat-*", "security-logs*"],
            "data_stream": {},
            "priority": 200,
            "template": {
              "settings": {
                "number_of_shards": 1,
                "number_of_replicas": 0
              }
            }
          }' > /dev/null && echo '✓ Filebeat template created'

        # 3. Create Metricbeat index template
        echo 'Setting up Metricbeat index template...'
        curl -s -X PUT "http://elasticsearch:9200/_index_template/metricbeat" \
          -u "elastic:$${ELASTIC_PASSWORD}" \
          -H "Content-Type: application/json" \
          -d '{
            "index_patterns": ["metricbeat-*"],
            "data_stream": {},
            "priority": 200,
            "template": {
              "settings": {
                "number_of_shards": 1,
                "number_of_replicas": 0
              }
            }
          }' > /dev/null && echo '✓ Metricbeat template created'

        echo '=== Setup complete ==='
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    # Deliberately NOT env_file: ./.env - Kibana maps ELASTICSEARCH_USERNAME
    # straight onto elasticsearch.username, and .env sets that to `elastic`
    # for the application. Kibana refuses to start as the superuser
    # ("value of elastic is forbidden"), so only the variables it should see
    # are passed explicitly below.
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?KIBANA_SYSTEM_PASSWORD must be set in .env}
      - XPACK_SECURITY_ENABLED=true
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_SAVEDOBJECTS_KEY:?KIBANA_SAVEDOBJECTS_KEY must be set in .env}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_REPORTING_KEY:?KIBANA_REPORTING_KEY must be set in .env}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:?KIBANA_ENCRYPTION_KEY must be set in .env}
    depends_on:
      setup-elk:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/monitoring/api/status || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 90s

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    user: root
    environment:
      # Referenced by filebeat.yml as ${ELASTIC_PASSWORD}.
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set in .env}
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_HOST=http://kibana:5601
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/log:/hostfs/var/log:ro
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
    depends_on:
      setup-elk:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    command: filebeat -e -strict.perms=false
    restart: no
    networks:
      - default

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.11.0
    user: root
    environment:
      # Referenced by metricbeat.yml as ${ELASTIC_PASSWORD}.
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set in .env}
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_HOST=http://kibana:5601
    volumes:
      - ./metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
    depends_on:
      setup-elk:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    command: metricbeat -e -strict.perms=false
    restart: no
    networks:
      - default

  packetbeat:
    image: docker.elastic.co/beats/packetbeat:8.11.0
    container_name: packetbeat
    user: root
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host  # IMPORTANT: Must use host network to capture traffic
    volumes:
      - ./packetbeat/packetbeat.yml:/usr/share/packetbeat/packetbeat.yml:ro
      - /var/log/packetbeat:/var/log/packetbeat
      - packetbeat-data:/usr/share/packetbeat/data
    depends_on:
      setup-elk:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
      logstash:
        condition: service_started
    environment:
      - ELASTICSEARCH_HOSTS=http://localhost:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - LOGSTASH_HOSTS=localhost:5044
    command: >
      packetbeat
        -e
        --strict.perms=false
        -c /usr/share/packetbeat/packetbeat.yml
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build: .
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

  frontend:
    build:
      context: ./website
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./website/.env
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/frontend"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  packetbeat-data:
