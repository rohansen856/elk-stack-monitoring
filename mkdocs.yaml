site_name: Advanced Threat Detection System
site_description: Enterprise-grade security monitoring solution with real-time APT detection using ELK Stack
site_author: Rohan Sen
site_url: https://elk-stack-monitoring.readthedocs.io/

repo_name: rohansen856/elk-stack-monitoring
repo_url: https://github.com/rohansen856/elk-stack-monitoring
edit_uri: blob/master/docs/

theme:
  name: material
  language: en
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      type: date
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: rohansen856
      repo: elk-stack-monitoring
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rohansen856/elk-stack-monitoring
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: BEGINNER_GUIDE.md
    - Setup & Installation: SETUP_AND_TROUBLESHOOTING.md
    - System Architecture: SYSTEM_ARCHITECTURE.md
  - ELK Stack:
    - Elasticsearch: ELASTICSEARCH.md
    - Logstash: LOGSTASH.md
    - Kibana: KIBANA.md
    - Beats Components: BEATS_COMPONENTS.md
  - Security:
    - Security Credentials: SECURITY_CREDENTIALS.md
    - APT Detection Rules: KIBANA_ESQL_ALERTING_RULES.md
    - APT Simulators: APT_SIMULATORS.md
  - Development:
    - API Documentation: API_DOCUMENTATION.md
    - Database Architecture: DATABASE_ARCHITECTURE.md
    - Component Interactions: COMPONENT_INTERACTIONS.md
    - Monitoring Guide: MONITORING.md
  - Deployment:
    - ELK Stack Guide: ELK_STACK_GUIDE.md
    - Kubernetes: KUBERNETES_DEPLOYMENT.md
    - Documentation: DOCS.md