apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: threat-detection
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.elasticsearch.hosts: [ "http://elasticsearch:9200" ]
    log.level: info
  pipelines.yml: |
    - pipeline.id: main
      path.config: "/usr/share/logstash/pipeline"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: threat-detection
  labels:
    app: logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
      - name: logstash
        image: docker.elastic.co/logstash/logstash:8.11.0
        ports:
        - containerPort: 5044
        - containerPort: 5000
        - containerPort: 9600
        - containerPort: 514
        - containerPort: 12201
        env:
        - name: LS_JAVA_OPTS
          value: "-Xmx256m -Xms256m"
        - name: XPACK_MONITORING_ELASTICSEARCH_HOSTS
          value: "http://elasticsearch:9200"
        - name: LOG_LEVEL
          value: "info"
        volumeMounts:
        - name: logstash-config
          mountPath: /usr/share/logstash/config/logstash.yml
          subPath: logstash.yml
        - name: logstash-config
          mountPath: /usr/share/logstash/config/pipelines.yml
          subPath: pipelines.yml
        - name: logstash-pipeline
          mountPath: /usr/share/logstash/pipeline
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "600m"
        livenessProbe:
          httpGet:
            path: /_node/stats
            port: 9600
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /_node/stats
            port: 9600
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: logstash-config
        configMap:
          name: logstash-config
      - name: logstash-pipeline
        hostPath:
          path: /home/rcsen/Documents/sih25/ps25238/logstash/pipeline
          type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: threat-detection
spec:
  selector:
    app: logstash
  ports:
  - name: beats
    port: 5044
    targetPort: 5044
  - name: tcp
    port: 5000
    targetPort: 5000
  - name: api
    port: 9600
    targetPort: 9600
  - name: syslog-tcp
    port: 514
    targetPort: 514
    protocol: TCP
  - name: syslog-udp
    port: 514
    targetPort: 514
    protocol: UDP
  - name: gelf
    port: 12201
    targetPort: 12201
  type: ClusterIP