# ---------------------------------------------------------------------------
# TEMPLATE ONLY - do not commit a filled-in copy of this file.
#
# A populated Secret containing the JWT signing key was previously committed to
# this public repository (AUDIT SEC-002), which allowed anyone to forge a token
# for any user. Create the Secret out of band instead:
#
#   kubectl create secret generic app-secrets -n threat-detection \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=ELASTIC_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=KIBANA_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=DATABASE_URL="postgresql://user:<POSTGRES_PASSWORD>@postgres:5432/todo_db" \
#     --from-literal=EMAIL_SMTP_PASSWORD="<smtp app password>" \
#     --from-literal=SLACK_WEBHOOK_URL="<slack webhook>"
#
# For GitOps, use a SealedSecret / External Secrets Operator / SOPS instead of
# a plain Secret so the ciphertext, never the value, is what is version
# controlled.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: threat-detection
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME_openssl_rand_hex_32"
  POSTGRES_PASSWORD: "REPLACE_ME"
  ELASTIC_PASSWORD: "REPLACE_ME"
  KIBANA_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgresql://user:REPLACE_ME@postgres:5432/todo_db"
  EMAIL_SMTP_PASSWORD: "REPLACE_ME"
  SLACK_WEBHOOK_URL: "REPLACE_ME"
