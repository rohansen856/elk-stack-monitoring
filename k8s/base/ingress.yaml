apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: threat-detection-ingress
  namespace: threat-detection
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    # Create the secret from a real certificate, or issue one with cert-manager:
    #   kubectl create secret tls threat-detection-tls \
    #     --cert=tls.crt --key=tls.key -n threat-detection
    - hosts:
        - threat-detection.local
        - kibana.threat-detection.local
      secretName: threat-detection-tls
  rules:
  - host: threat-detection.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
  - host: kibana.threat-detection.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kibana
            port:
              number: 5601

---
# LoadBalancer service for development (alternative to ingress)
apiVersion: v1
kind: Service
metadata:
  name: frontend-loadbalancer
  namespace: threat-detection
  annotations:
    metallb.universe.tf/allow-shared-ip: "threat-detection-shared"
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http

---
apiVersion: v1
kind: Service
metadata:
  name: backend-loadbalancer
  namespace: threat-detection
  annotations:
    metallb.universe.tf/allow-shared-ip: "threat-detection-shared"
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http

---
# The kibana-loadbalancer Service was removed: it placed Kibana directly on
# a public IP over plain HTTP. Reach Kibana through the ingress instead,
# which terminates TLS. See AUDIT SEC-008.
  selector:
    app: kibana
  ports:
  - port: 5601
    targetPort: 5601
    protocol: TCP
    name: http