apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: threat-detection

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - elasticsearch.yaml
  - logstash.yaml
  - kibana.yaml
  - migrate-job.yaml
  - backend.yaml
  - frontend.yaml
  - beats.yaml
  - networkpolicy.yaml
  # ingress.yaml is intentionally opt-in: it needs an ingress controller
  # and a TLS secret. Apply it separately once those exist:
  #   kubectl apply -f k8s/base/ingress.yaml
  # - ingress.yaml

# The Logstash pipeline is generated from the real files in the repository
# rather than mounted from a host path that only exists on one workstation.
configMapGenerator:
  - name: logstash-pipeline
    files:
      - ../../logstash/pipeline/logstash.conf
      - ../../logstash/pipeline/threat-intel-enrichment.conf

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: ps25238-app
    newTag: latest
  - name: ps25238-frontend
    newTag: latest

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2

labels:
- pairs:
    app.kubernetes.io/name: advanced-threat-detection
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: threat-detection-system