apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: threat-detection

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - elasticsearch.yaml
  - logstash.yaml
  - kibana.yaml
  - migrate-job.yaml
  - backend.yaml
  - frontend.yaml
  - beats.yaml
  # - ingress.yaml  # Commented out due to ingress controller issues

images:
  - name: ps25238-app
    newTag: latest
  - name: ps25238-frontend
    newTag: latest

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2

labels:
- pairs:
    app.kubernetes.io/name: advanced-threat-detection
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: threat-detection-system