apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: threat-detection
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LOGSTASH_LOG_LEVEL: "info"
  ALGORITHM: "HS256"
  # 30 minutes. This was 43200 (30 days) while the signing key was committed to
  # a public repository and no revocation mechanism existed. See AUDIT SEC-002.
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"

  # Database. Credentials are NOT here: DATABASE_URL is assembled by the
  # workload from the app-secrets Secret. A ConfigMap is world-readable to
  # anything with namespace read access.
  POSTGRES_DB: "todo_db"
  POSTGRES_USER: "user"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

  # Redis
  REDIS_URL: "redis://redis:6379/0"

  # ELK Stack
  ELASTICSEARCH_HOST: "elasticsearch"
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_USERNAME: "elastic"
  KIBANA_HOST: "kibana"
  KIBANA_PORT: "5601"
  LOGSTASH_HOST: "logstash"
  LOGSTASH_PORT: "5044"
  LOGSTASH_TCP_PORT: "5000"

  # CORS - set to the real deployed origin.
  CORS_ORIGINS: "http://threat-detection.local"

  # Elasticsearch Settings
  ES_JAVA_OPTS: "-Xms512m -Xmx512m"
