apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: threat-detection
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LOGSTASH_LOG_LEVEL: "info"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "43200"

  # Database
  POSTGRES_DB: "todo_db"
  POSTGRES_USER: "user"
  DATABASE_URL: "postgresql://user:password@postgres:5432/todo_db"

  # Redis
  REDIS_URL: "redis://redis:6379/0"

  # ELK Stack
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  ELASTICSEARCH_HOST: "elasticsearch"
  ELASTICSEARCH_PORT: "9200"
  KIBANA_HOST: "kibana"
  KIBANA_PORT: "5601"
  LOGSTASH_HOST: "logstash"
  LOGSTASH_PORT: "5044"
  LOGSTASH_TCP_PORT: "5000"

  # Elasticsearch Settings
  ES_JAVA_OPTS: "-Xms512m -Xmx512m"

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: threat-detection
type: Opaque
data:
  SECRET_KEY: NUgyYThndDBscVJ6N1AxeFl3OU5iNHNLNnRVbTNDakZ2Wi1lUWhTMG9MckJpR2RU  # Base64 encoded
